
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sky Hunter - Bird Shooting</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Arial,sans-serif;background:#0c1b28;overflow:hidden;user-select:none;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,100dvh*9/16);height:min(100dvh,100vw*16/9);overflow:hidden;background:#78d6ff;box-shadow:0 0 50px #000a}
canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
#hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;color:white}
.stat{background:#102d46d9;padding:10px 15px;border:1px solid #ffffff50;border-radius:14px;box-shadow:0 4px 12px #16415c35;min-width:82px;text-align:center}
.stat small{display:block;font-size:10px;letter-spacing:1.5px;color:#bceaff;margin-bottom:5px}
.stat strong{font-size:21px}
#rightHud{display:flex;gap:8px}
#sound{position:absolute;top:104px;right:16px;background:#102d46d9;color:white;border:1px solid #ffffff55;padding:10px 13px;border-radius:12px;cursor:pointer}
#message{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(90%,390px);padding:27px 22px;text-align:center;color:white;background:#102d46ed;border:1px solid #ffffff55;border-radius:23px;box-shadow:0 15px 60px #12344b55}
#message h1{font-size:32px;margin-bottom:10px;letter-spacing:1px}
#message p{color:#d6efff;line-height:1.6;font-size:14px;margin-bottom:20px}
#mainBtn{border:0;background:#ffca45;color:#172c3b;font-size:16px;font-weight:800;padding:14px 25px;border-radius:12px;cursor:pointer;width:100%}
#message .hint{font-size:11px;color:#a9d8f0;margin-top:15px;margin-bottom:0}
#fire{position:absolute;right:22px;bottom:25px;width:90px;height:90px;border-radius:50%;border:4px solid #ffffffa0;background:#ff6549;color:white;font-size:15px;font-weight:900;box-shadow:0 6px 0 #b8392a,0 8px 20px #123a4c50;display:none;touch-action:manipulation}
#reload{position:absolute;left:18px;bottom:25px;border:1px solid #ffffff70;border-radius:12px;padding:12px 15px;background:#102d46d9;color:white;display:none}
#toast{position:absolute;top:145px;left:50%;transform:translateX(-50%);color:white;font-size:23px;font-weight:900;text-shadow:0 2px 5px #17344c;pointer-events:none}
@media(max-width:520px){.stat{padding:8px 9px;min-width:66px}.stat strong{font-size:17px}.stat small{font-size:9px}#hud{top:10px;left:8px;right:8px;gap:5px}#rightHud{gap:5px}#sound{top:91px;right:9px}#message h1{font-size:27px}}
@media(pointer:coarse){#fire{display:block}#reload{display:block}}
</style>
</head>
<body>
<div id="stage">
<canvas id="game"></canvas>

<div id="hud">
  <div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
  <div class="stat"><small>LEVEL</small><strong id="level">1</strong></div>
  <div id="rightHud">
    <div class="stat"><small>AMMO</small><strong id="ammo">12/12</strong></div>
  </div>
</div>
<button id="sound">🔊 SOUND</button>
<div id="toast"></div>

<div id="message">
  <h1 id="title">🐦 SKY HUNTER</h1>
  <p id="description">Aim carefully, watch the sky and hit the flying targets!<br><br>🎯 Aim with your mouse<br>🔫 Click to shoot<br>🔄 Press R to reload</p>
  <button id="mainBtn">▶ START GAME</button>
  <p class="hint">ARCADE GAME · NO INSTALLATION REQUIRED</p>
</div>

<button id="fire">FIRE!</button>
<button id="reload">↻ RELOAD (R)</button>
</div>

<script>
(() => {
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const stage=document.getElementById("stage");
const $=id=>document.getElementById(id);

let W=stage.clientWidth||innerWidth,H=stage.clientHeight||innerHeight,dpr=1;
let running=false,paused=false,score=0,level=1,ammo=12;
let birds=[],bullets=[],clouds=[],particles=[];
let last=0,spawnClock=0,shotCooldown=0,reloadClock=0;
let soundOn=true,audio=null,toastTimer=0;
let aim={x:W*.65,y:H*.4};
let pointerDown=false;
const MAX_AMMO=12;

function resize(){
  W=stage.clientWidth||innerWidth;H=stage.clientHeight||innerHeight;dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!clouds.length){
    for(let i=0;i<9;i++)clouds.push({
      x:Math.random()*W,y:Math.random()*H*.55,
      s:.45+Math.random()*1.0,v:5+Math.random()*10
    });
  }
}
addEventListener("resize",resize);resize();

function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function beep(freq=500,duration=.07,type="square",volume=.045){
  if(!soundOn)return;
  try{
    audio=audio||new(window.AudioContext||window.webkitAudioContext)();
    if(audio.state==="suspended")audio.resume();
    const osc=audio.createOscillator(),gain=audio.createGain();
    osc.type=type;osc.frequency.value=freq;
    gain.gain.setValueAtTime(volume,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
    osc.connect(gain);gain.connect(audio.destination);
    osc.start();osc.stop(audio.currentTime+duration);
  }catch(e){}
}

function makeBird(){
  const fromLeft=Math.random()<.5;
  const size=rand(18,27);
  birds.push({
    x:fromLeft?-size*2:W+size*2,
    y:rand(H*.17,H*.61),
    size,
    speed:rand(65,105)+level*5,
    dir:fromLeft?1:-1,
    phase:rand(0,Math.PI*2),
    flap:rand(5,8),
    color:["#263b4a","#374b58","#4c5860","#6a5143"][Math.floor(Math.random()*4)],
    bob:rand(0,Math.PI*2)
  });
}

function startGame(){
  score=0;level=1;ammo=MAX_AMMO;
  birds=[];bullets=[];particles=[];
  spawnClock=.3;shotCooldown=0;reloadClock=0;
  running=true;paused=false;
  $("message").style.display="none";
  updateHud();
  last=performance.now();
}
function endGame(){
  running=false;paused=false;
  $("title").textContent="🎯 GAME OVER";
  $("description").innerHTML=`Final score: <b>${score}</b><br>Level reached: <b>${level}</b><br><br>Ready for another round?`;
  $("mainBtn").textContent="↻ PLAY AGAIN";
  $("message").style.display="block";
}
function updateHud(){
  $("score").textContent=score;
  $("level").textContent=level;
  $("ammo").textContent=reloadClock>0?"...":`${ammo}/${MAX_AMMO}`;
}
function showToast(text){
  $("toast").textContent=text;toastTimer=1;
}
function reload(){
  if(!running||paused||reloadClock>0||ammo===MAX_AMMO)return;
  reloadClock=1.05;beep(300,.08,"triangle");
  $("ammo").textContent="...";
}
$("mainBtn").addEventListener("click",startGame);
$("reload").addEventListener("click",reload);
$("sound").addEventListener("click",()=>{
  soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 SOUND":"🔇 MUTED";
});

function getPointer(e){
  const r=canvas.getBoundingClientRect();
  aim.x=clamp(e.clientX-r.left,0,W);
  aim.y=clamp(e.clientY-r.top,0,H);
}
canvas.addEventListener("pointermove",e=>getPointer(e));
canvas.addEventListener("pointerdown",e=>{
  getPointer(e);
  if(e.pointerType==="touch"){pointerDown=true;e.preventDefault();return}
  shoot();
});
canvas.addEventListener("pointerup",()=>pointerDown=false);
$("fire").addEventListener("pointerdown",e=>{
  e.preventDefault();shoot();
});
addEventListener("keydown",e=>{
  if(e.key.toLowerCase()==="r")reload();
  if(e.key===" "){e.preventDefault();shoot()}
  if(e.key==="Escape"&&running){
    paused=!paused;
    if(paused){
      $("title").textContent="⏸ PAUSED";
      $("description").textContent="Take a breath, hunter. Your birds are waiting!";
      $("mainBtn").textContent="▶ RESUME";
      $("message").style.display="block";
    }else $("message").style.display="none";
  }
});
$("mainBtn").addEventListener("click",()=>{
  // The main button starts a new round; the pause screen is resumed below.
});
function shoot(){
  if(!running||paused||reloadClock>0||shotCooldown>0)return;
  if(ammo<=0){showToast("RELOAD!");beep(170,.1);return}
  ammo--;shotCooldown=.22;
  const startX=W*.5,startY=H*.86;
  const dx=aim.x-startX,dy=aim.y-startY;
  const len=Math.hypot(dx,dy)||1;
  bullets.push({
    x:startX,y:startY,
    tx:aim.x,ty:aim.y,
    x0:startX,y0:startY,
    t:0,duration:clamp(len/1800,.07,.24)
  });
  particles.push({x:startX,y:startY-25,vx:rand(-20,20),vy:-rand(25,75),life:.14,max:.14,color:"#ffe59a",size:rand(5,10)});
  beep(100,.075,"sawtooth",.035);
  updateHud();
}

function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#39a9f3");g.addColorStop(.58,"#a3e2ff");g.addColorStop(1,"#e0f7ff");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const sun=ctx.createRadialGradient(W*.82,H*.16,3,W*.82,H*.16,100);
  sun.addColorStop(0,"#fffbd0aa");sun.addColorStop(1,"#fffbd000");
  ctx.fillStyle=sun;ctx.fillRect(W*.82-100,H*.16-100,200,200);
}
function drawCloud(c){
  ctx.save();ctx.translate(c.x,c.y);ctx.scale(c.s,c.s);
  ctx.fillStyle="#ffffffa8";
  ctx.beginPath();ctx.ellipse(0,0,32,12,0,0,Math.PI*2);
  ctx.ellipse(-18,1,17,10,0,0,Math.PI*2);
  ctx.ellipse(4,-9,18,16,0,0,Math.PI*2);
  ctx.ellipse(21,-2,20,11,0,0,Math.PI*2);
  ctx.fill();ctx.restore();
}
function drawLandscape(){
  // distant hills
  ctx.fillStyle="#83c98a";
  ctx.beginPath();ctx.moveTo(0,H*.79);
  ctx.quadraticCurveTo(W*.18,H*.66,W*.36,H*.8);
  ctx.quadraticCurveTo(W*.63,H*.67,W*.82,H*.79);
  ctx.quadraticCurveTo(W*.94,H*.72,W,H*.77);
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  // grass
  ctx.fillStyle="#398a4c";ctx.fillRect(0,H*.91,W,H*.09);
  ctx.fillStyle="#55a85b";ctx.fillRect(0,H*.91,W,5);
  // stylized tree line
  const spacing=clamp(W/24,22,42);
  for(let x=-20;x<W+spacing;x+=spacing){
    const h=H*(.045+((Math.sin(x*12.4)+1)*.025));
    ctx.fillStyle=(Math.floor(x/spacing)%2===0)?"#236947":"#2b7650";
    ctx.beginPath();ctx.moveTo(x,H*.92-h);
    ctx.lineTo(x-spacing*.42,H*.92);
    ctx.lineTo(x+spacing*.42,H*.92);ctx.fill();
  }
}
function drawBird(b){
  ctx.save();ctx.translate(b.x,b.y+Math.sin(b.bob)*3);
  if(b.dir<0)ctx.scale(-1,1);
  const flap=Math.sin(b.phase)*b.flap;
  ctx.fillStyle=b.color;
  // body and head
  ctx.beginPath();ctx.ellipse(0,0,b.size*.55,b.size*.24,-.1,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(b.size*.43,-b.size*.1,b.size*.2,0,Math.PI*2);ctx.fill();
  // beak
  ctx.fillStyle="#e6a64a";ctx.beginPath();
  ctx.moveTo(b.size*.58,-b.size*.1);ctx.lineTo(b.size*.88,-b.size*.02);ctx.lineTo(b.size*.59,b.size*.02);ctx.fill();
  // wings flap
  ctx.fillStyle=b.color;
  ctx.beginPath();ctx.moveTo(-b.size*.1,0);
  ctx.quadraticCurveTo(-b.size*.4,-b.size*(.2+flap*.045),-b.size*.75,-b.size*(.25+flap*.09));
  ctx.quadraticCurveTo(-b.size*.58,b.size*.02,-b.size*.1,b.size*.1);ctx.fill();
  ctx.beginPath();ctx.moveTo(-b.size*.25,0);
  ctx.quadraticCurveTo(-b.size*.45,b.size*(.18+flap*.035),-b.size*.68,b.size*(.28+flap*.06));
  ctx.quadraticCurveTo(-b.size*.48,b.size*.08,-b.size*.1,b.size*.08);ctx.fill();
  ctx.fillStyle="white";ctx.beginPath();ctx.arc(b.size*.48,-b.size*.14,2.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#142c3b";ctx.beginPath();ctx.arc(b.size*.5,-b.size*.14,1,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawGun(){
  const gx=W*.5,gy=H*.91;
  ctx.save();ctx.translate(gx,gy);
  const angle=Math.atan2(aim.y-gy,aim.x-gx);
  ctx.rotate(angle+Math.PI/2);
  // arm sleeves
  ctx.fillStyle="#263f59";
  ctx.beginPath();ctx.moveTo(-37,48);ctx.lineTo(-29,-12);ctx.lineTo(-9,-23);ctx.lineTo(9,-23);ctx.lineTo(29,-12);ctx.lineTo(37,48);ctx.closePath();ctx.fill();
  // hand
  ctx.fillStyle="#d9a17a";
  ctx.beginPath();ctx.roundRect(-17,-32,34,35,9);ctx.fill();
  // pistol grip
  ctx.fillStyle="#28333e";
  ctx.beginPath();ctx.moveTo(-15,-33);ctx.lineTo(15,-33);ctx.lineTo(18,5);ctx.lineTo(10,27);ctx.lineTo(-9,27);ctx.lineTo(-17,4);ctx.closePath();ctx.fill();
  // barrel
  const metal=ctx.createLinearGradient(-15,0,15,0);
  metal.addColorStop(0,"#526574");metal.addColorStop(.45,"#d1dce3");metal.addColorStop(1,"#536574");
  ctx.fillStyle=metal;
  ctx.beginPath();ctx.roundRect(-13,-87,26,58,5);ctx.fill();
  ctx.fillStyle="#202e39";ctx.fillRect(-8,-83,16,37);
  ctx.fillStyle="#728797";ctx.fillRect(-14,-52,28,7);
  // trigger guard
  ctx.strokeStyle="#b9c7d0";ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,-24,10,0,Math.PI);ctx.stroke();
  ctx.fillStyle="#1d2831";ctx.fillRect(-4,-31,8,13);
  // sights
  ctx.fillStyle="#202b34";ctx.fillRect(-9,-90,5,6);ctx.fillRect(4,-90,5,6);
  ctx.restore();
}
function drawCrosshair(){
  const x=aim.x,y=aim.y;
  ctx.save();ctx.strokeStyle="#ffffff";ctx.lineWidth=2;
  ctx.shadowColor="#142f43";ctx.shadowBlur=4;
  ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-17,y);ctx.lineTo(x-6,y);
  ctx.moveTo(x+6,y);ctx.lineTo(x+17,y);
  ctx.moveTo(x,y-17);ctx.lineTo(x,y-6);
  ctx.moveTo(x,y+6);ctx.lineTo(x,y+17);ctx.stroke();
  ctx.restore();
}
function drawBullets(){
  for(const b of bullets){
    const t=clamp(b.t/b.duration,0,1);
    const x=b.x0+(b.tx-b.x0)*t,y=b.y0+(b.ty-b.y0)*t;
    ctx.strokeStyle="#fff4a0";ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-(b.tx-b.x0)*.025,y-(b.ty-b.y0)*.025);ctx.stroke();
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function update(dt){
  clouds.forEach(c=>{
    c.x+=c.v*dt;
    if(c.x>W+100)c.x=-100;
  });
  shotCooldown=Math.max(0,shotCooldown-dt);
  if(reloadClock>0){
    reloadClock-=dt;
    if(reloadClock<=0){reloadClock=0;ammo=MAX_AMMO;showToast("RELOADED!");beep(650,.08,"triangle");updateHud()}
  }
  if(!running||paused)return;
  spawnClock-=dt;
  if(spawnClock<=0){
    makeBird();
    spawnClock=rand(1.15,1.8)-Math.min(level*.045,.4);
  }
  birds.forEach(b=>{
    b.x+=b.speed*b.dir*dt;
    b.phase+=dt*7;b.bob+=dt*2.5;
  });
  birds=birds.filter(b=>b.x>-100&&b.x<W+100);
  bullets.forEach(b=>b.t+=dt);
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    if(b.t>=b.duration){
      // Check only near the selected aim point, with a forgiving hit radius.
      let hitIndex=-1,best=Infinity;
      for(let j=0;j<birds.length;j++){
        const bird=birds[j];
        const d=Math.hypot(b.tx-bird.x,b.ty-bird.y);
        const radius=bird.size*.85+5;
        if(d<radius&&d<best){best=d;hitIndex=j}
      }
      if(hitIndex>=0){
        const bird=birds[hitIndex];
        for(let k=0;k<12;k++)particles.push({
          x:bird.x,y:bird.y,vx:rand(-90,90),vy:rand(-100,70),
          life:rand(.25,.55),max:.55,color:["#ffe49a","#ffffff","#ffc46b"][k%3],size:rand(2,5)
        });
        birds.splice(hitIndex,1);
        score+=10;level=Math.floor(score/100)+1;
        showToast("+10 HIT!");
        beep(750,.12,"triangle");
        updateHud();
      }
      bullets.splice(i,1);
    }
  }
  particles.forEach(p=>{
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.life-=dt;
  });
  particles=particles.filter(p=>p.life>0);
  if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$("toast").textContent=""}
}
function render(now){
  const dt=Math.min((now-last)/1000||0,.035);last=now;
  update(dt);
  drawSky();
  clouds.forEach(drawCloud);
  drawLandscape();
  birds.forEach(drawBird);
  drawBullets();
  drawParticles();
  drawGun();
  drawCrosshair();
  if(paused){
    ctx.fillStyle="#102d4666";ctx.fillRect(0,0,W,H);
  }
  requestAnimationFrame(render);
}
last=performance.now();
requestAnimationFrame(render);

// Make the main button resume correctly from the pause overlay.
const originalStart=startGame;
function handleMainButton(){
  if(paused){
    paused=false;
    $("message").style.display="none";
    last=performance.now();
  }else startGame();
}
$("mainBtn").onclick=handleMainButton;
})();
</script>
</body>
</html>
